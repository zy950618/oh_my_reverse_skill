name: Capability Matrix

on:
  push:
    paths:
      - "tools/**"
      - "reports/capability-matrix.*"
      - "**/README.md"
      - "**/INSTALL.md"
      - "**/USAGE.md"
      - "**/SKILL.md"
      - "**/*.contract.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
  pull_request:
    paths:
      - "tools/**"
      - "reports/capability-matrix.*"
      - "**/README.md"
      - "**/INSTALL.md"
      - "**/USAGE.md"
      - "**/SKILL.md"
      - "**/*.contract.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

jobs:
  capability-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run negative and integration tests
        run: python3 -B -m unittest discover -s tools/capabilities/tests -p "test_*.py" -v
      - name: Generate and fail closed on drift
        run: python3 -B tools/capabilities/capability_matrix.py --schema tools/capabilities/schema.yaml --repo-root .
      - name: Require checked-in reports to be current
        run: git diff --exit-code -- reports/capability-matrix.json reports/capability-matrix.md
